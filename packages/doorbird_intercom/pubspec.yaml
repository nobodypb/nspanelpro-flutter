name: doorbird_intercom
description: Private Android DoorBird media extension for the local NSPanel integration.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: local.nspanel.doorbird
        pluginClass: DoorBirdPlugin
  assets:
    - assets/licenses/intercom.txt
